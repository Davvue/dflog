[package]
name = "dflog"
version = "0.1.0"
edition = "2024"
# `File::lock`, used to serialize journal appends, is stable since 1.89.
rust-version = "1.89"
description = "Tamper-evident, hash-chained activity log for digital forensic investigations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Davvue/dflog"
readme = "README.md"
keywords = ["forensics", "dfir", "audit", "chain-of-custody", "hashing"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
gethostname = "1.1.0"
jiff = { version = "0.2.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
signal-hook = "0.4.6"
thiserror = "2.0.21"
toml = "1.2.1"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"